name: Check policy slide typography
on:
  push:
    paths:
      - '.github/workflows/check-hse-typography.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Examine banner typography rules in source
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('executive/index.html').read_text(encoding='utf-8')
          for sel in ['.ig-total','.ig-total b','.ig-total em','.ig-total span','.ig-total .', '.ig-ask-h b','.ig-check li']:
            print('SELECTOR',sel)
            for m in list(re.finditer(re.escape(sel)+r'[^{}]{0,130}\{[^{}]{0,1500}\}',s))[-12:]:
              print('RULE',repr(m.group(0)[:1500]))
          PY
      - name: Browser geometry for policy slide and summary banner
        run: |
          mkdir -p /tmp/hse && cd /tmp/hse
          npm install --no-save playwright-core@1.58.2 --silent
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1600,height:960}});
            await page.goto('https://safety-academy-hse.pages.dev/executive/?typography-audit=2',{waitUntil:'networkidle',timeout:45000});
            await page.locator('button').filter({hasText:/การสนับสนุนที่ต้องการจากผู้บริหาร/}).first().click();
            await page.evaluate(()=>document.fonts.ready);
            await page.waitForTimeout(700);
            const data=await page.evaluate(()=>{
              const el=document.querySelector('.ig-total');
              if(!el)return {error:'no ig-total'};
              const props=x=>{const r=x.getBoundingClientRect(),s=getComputedStyle(x);return {tag:x.tagName,cls:x.className,text:x.textContent?.trim().slice(0,220),font:s.font,size:s.fontSize,line:s.lineHeight,whiteSpace:s.whiteSpace,display:s.display,flex:s.flex,gridCols:s.gridTemplateColumns,justify:s.justifyContent,wrap:s.flexWrap,textOverflow:s.textOverflow,overflow:s.overflow,width:Math.round(r.width),height:Math.round(r.height),scrollWidth:x.scrollWidth,scrollHeight:x.scrollHeight,left:Math.round(r.left),right:Math.round(r.right),top:Math.round(r.top),bottom:Math.round(r.bottom),padding:s.padding}};
              return {parent:props(el),children:[...el.children].map(props),stage:props(document.querySelector('.stage')),viewport:{width:window.innerWidth,height:window.innerHeight}}
            });
            console.log('BANNER_GEOMETRY',JSON.stringify(data));
            await browser.close()
          })();
          JS
          node check.cjs
