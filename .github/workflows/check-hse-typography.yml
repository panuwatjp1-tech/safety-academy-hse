name: Fix and verify HSE presentation footer typography
on:
  push:
    paths:
      - '.github/workflows/check-hse-typography.yml'
permissions:
  contents: write
jobs:
  fix-typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Minimal scoped CSS typography correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('executive/index.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('</head>')==1,'unexpected head structure'
          assert s.count('.ig-total b{font:800 40px Inter,sans-serif;margin-left:auto}')==1,'baseline font style not found'
          assert 'hse-typography-fix-20261122' not in s,'fix already applied'
          css='''<style id="hse-typography-fix-20261122">
          /* Presentation-only: keep the executive decision summary readable, without changing content. */
          .stage .ig-total{display:flex!important;align-items:center!important;gap:12px!important;padding:12px 18px!important;max-width:100%!important;min-width:0!important;overflow:hidden!important}
          .stage .ig-total>span{font:700 17px/1.35 'IBM Plex Sans Thai',sans-serif!important;flex:0 0 auto!important;white-space:nowrap!important}
          .stage .ig-total>em{font:700 15px/1.35 'IBM Plex Sans Thai',sans-serif!important;padding:6px 12px!important;flex:0 1 auto!important;min-width:0!important;max-width:43%!important;white-space:normal!important}
          .stage .ig-total>b{font:700 22px/1.3 'IBM Plex Sans Thai',sans-serif!important;margin-left:auto!important;flex:0 1 auto!important;min-width:0!important;white-space:normal!important;overflow-wrap:normal!important;text-align:right!important}
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          assert s.count('hse-typography-fix-20261122')==1
          p.write_text(s,encoding='utf-8')
          print('TYPOGRAPHY_CSS_APPLIED',len(s.encode('utf-8')))
          PY
          git diff --check
      - name: Live browser test of modified slide before deploy
        shell: bash
        run: |
          python -m http.server 8765 > /tmp/hse-webserver.log 2>&1 &
          sleep 2
          cd /tmp
          mkdir -p hse-typography-work
          cd hse-typography-work
          npm install --no-save playwright-core@1.58.2 --silent
          cat > verify.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              const page=await browser.newPage({viewport:{width:1600,height:960}});
              await page.goto('http://127.0.0.1:8765/executive/',{waitUntil:'domcontentloaded',timeout:45000});
              await page.locator('button').filter({hasText:/การสนับสนุนที่ต้องการจากผู้บริหาร/}).first().click();
              await page.evaluate(()=>document.fonts.ready);
              await page.waitForTimeout(1000);
              const test=await page.evaluate(()=>{
                const el=document.querySelector('.ig-total'),last=el?.querySelector('b');
                if(!el||!last)return {ok:false,error:'missing summary'};
                const e=el.getBoundingClientRect(),b=last.getBoundingClientRect(),s=getComputedStyle(last);
                return {ok:el.scrollWidth<=el.clientWidth+2 && b.right<=e.right && b.left>=e.left && s.fontFamily.includes('IBM Plex Sans Thai'),clientWidth:el.clientWidth,scrollWidth:el.scrollWidth,bannerRight:e.right,lastRight:b.right,font:s.fontFamily,fontSize:s.fontSize,lastText:last.textContent?.trim(),lastScroll:last.scrollWidth,lastClient:last.clientWidth}
              });
              console.log('LOCAL_TYPOGRAPHY_TEST',JSON.stringify(test));
              if(!test.ok)process.exitCode=1;
              if(test.ok)console.log('LOCAL_TYPOGRAPHY_PASS');
            }finally{await browser.close()}
          })();
          JS
          node verify.cjs
      - name: Commit corrected presentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add executive/index.html
          git commit -m "fix: restore legible Thai typography in HSE executive decision summary"
          git push origin HEAD:main
      - name: Verify deployed production typography
        shell: bash
        run: |
          cd /tmp/hse-typography-work
          cat > production.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage({viewport:{width:1600,height:960}});
              for(let i=0;i<25;i++){
                await page.goto('https://safety-academy-hse.pages.dev/executive/?typography-final='+i,{waitUntil:'domcontentloaded',timeout:45000});
                const fixed=await page.locator('#hse-typography-fix-20261122').count()>0;
                console.log('DEPLOY_CHECK',i+1,fixed?'CSS_DEPLOYED':'WAIT');
                if(fixed)break;
                if(i===24)throw new Error('Production CSS not deployed');
                await page.waitForTimeout(4500);
              }
              await page.locator('button').filter({hasText:/การสนับสนุนที่ต้องการจากผู้บริหาร/}).first().click();
              await page.evaluate(()=>document.fonts.ready);
              await page.waitForTimeout(1200);
              const metrics=await page.evaluate(()=>{
                const el=document.querySelector('.ig-total'),last=el.querySelector('b'),e=el.getBoundingClientRect(),b=last.getBoundingClientRect(),s=getComputedStyle(last);
                return {ok:el.scrollWidth<=el.clientWidth+2 && b.right<=e.right && s.fontFamily.includes('IBM Plex Sans Thai'),scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,lastRight:b.right,bannerRight:e.right,font:s.fontFamily,size:s.fontSize};
              });
              console.log('PRODUCTION_TYPOGRAPHY',JSON.stringify(metrics));
              if(!metrics.ok)throw new Error('Production banner overflow or wrong font');
              const img=await page.screenshot({type:'jpeg',quality:52});
              console.log('SCREENSHOT_BASE64',img.toString('base64'));
              console.log('PRODUCTION_TYPOGRAPHY_VERIFIED');
            }finally{await browser.close()}
          })();
          JS
          node production.cjs
