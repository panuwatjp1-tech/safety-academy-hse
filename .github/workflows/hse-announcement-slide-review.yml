name: Verify deployed HSE announcement wording
on:
  push:
    paths:
      - '.github/workflows/hse-announcement-slide-review.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production presentation announcement after deploy
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,time
          url='https://safety-academy-hse.pages.dev/executive/'
          for i in range(18):
            req=urllib.request.Request(url+'?notice-check=e0afeda-'+str(i),headers={'Cache-Control':'no-cache','User-Agent':'HSE-Announcement-Verification/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=15) as r:
                s=r.read().decode('utf-8')
              good=('รายวัน 50 บาท' not in s and 'รายเดือน 100 บาท' not in s and 'ลงชื่อรับทราบและยินยอม' not in s and s.count('พักงานทางวินัย 1 วันไม่จ่ายค่าจ้าง')>=2)
              print('CHECK',i+1,'HTTP 200','NEW_POLICY_COUNT',s.count('พักงานทางวินัย 1 วันไม่จ่ายค่าจ้าง'),'FINE_50',('รายวัน 50 บาท' in s),'FINE_100',('รายเดือน 100 บาท' in s),'PASS' if good else 'WAIT',flush=True)
              if good: break
            except Exception as e:
              print('CHECK',i+1,'ERROR',str(e)[:300],flush=True)
            time.sleep(5)
          else:
            raise SystemExit('PRODUCTION_VERIFICATION_FAILED')
          print('PRODUCTION_VERIFIED')
          PY
