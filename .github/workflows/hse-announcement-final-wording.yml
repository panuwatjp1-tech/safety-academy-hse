name: Final announcement wording alignment
on:
  push:
    paths:
      - '.github/workflows/hse-announcement-final-wording.yml'
permissions:
  contents: write
jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match company announcement wording and verify production
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('executive/index.html')
          s=p.read_text(encoding='utf-8')
          old='· ไม่ปรับหรือหักค่าจ้าง'
          new='· ไม่ใช้ค่าปรับหรือหักค่าจ้างเป็นค่าปรับ'
          if s.count(old)!=1: raise ValueError(f'Expected one exact text, got {s.count(old)}')
          s=s.replace(old,new,1)
          if old in s or 'รายวัน 50 บาท' in s or 'รายเดือน 100 บาท' in s: raise ValueError('Old disciplinary wording remains')
          if s.count('พักงานทางวินัย 1 วัน')<2: raise ValueError('Suspension rule missing')
          p.write_text(s,encoding='utf-8')
          print('FINAL_WORDING_UPDATED')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add executive/index.html
          git commit -m "fix: use exact no-fine wording from company safety announcement"
          git push origin HEAD:main
          python - <<'PY'
          import urllib.request,time
          url='https://safety-academy-hse.pages.dev/executive/'
          for i in range(18):
            req=urllib.request.Request(url+'?notice-final-check='+str(i),headers={'Cache-Control':'no-cache','User-Agent':'HSE-Final-Policy-Check'})
            try:
              with urllib.request.urlopen(req,timeout=15) as res:
                s=res.read().decode('utf-8')
              good=('· ไม่ใช้ค่าปรับหรือหักค่าจ้างเป็นค่าปรับ' in s and s.count('พักงานทางวินัย 1 วัน')>=2 and 'รายวัน 50 บาท' not in s and 'รายเดือน 100 บาท' not in s)
              print('PRODUCTION_CHECK',i+1, 'PASS' if good else 'WAIT',flush=True)
              if good:
                print('PRODUCTION_VERIFIED_FINAL')
                break
            except Exception as e: print('CHECK_ERROR',str(e)[:100],flush=True)
            time.sleep(5)
          else: raise SystemExit('PRODUCTION_VERIFICATION_FAILED')
          PY
